name = "wol-cloud-trigger"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Bind a KV Namespace for storage (Free tier includes 100k reads/day, 1k writes/day)
# Run `wrangler kv:namespace create WOL_STORE` and replace the id below:
[[kv_namespaces]]
binding = "WOL_STORE"
id = "YOUR_KV_NAMESPACE_ID"
preview_id = "YOUR_KV_NAMESPACE_PREVIEW_ID"
