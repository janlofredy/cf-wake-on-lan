name = "wol-cloud-trigger"
main = "src/index.js"
compatibility_date = "2024-01-01"

# ==============================================================================
# KV Namespace Binding: WOL_STORE
# ==============================================================================
# For Cloudflare Dashboard (Deploy from Git):
# Add the binding in Dashboard -> Workers & Pages -> Settings -> Bindings:
#   Variable name: WOL_STORE
#   KV namespace: WOL_STORE
#
# For CLI Deployment (npx wrangler deploy):
# [[kv_namespaces]]
# binding = "WOL_STORE"
# id = "YOUR_KV_NAMESPACE_ID"
