name = "cf-wake-on-lan"
main = "cloudflare-worker/src/index.js"
compatibility_date = "2024-01-01"
workers_dev = true

# ==============================================================================
# KV Namespace Binding: WOL_STORE
# ==============================================================================
# If you are forking this repository:
# 1. Create your own KV namespace in Cloudflare: npx wrangler kv namespace create WOL_STORE
# 2. Replace the id below with your own KV namespace ID.
[[kv_namespaces]]
binding = "WOL_STORE"
id = "YOUR_KV_NAMESPACE_ID"
